# 有证慧催 后端 · 基础配置（不含任何环境凭据）
#
# 部署形态铁律（勿回退）：
#   ① 默认 profile = prod，且 prod 不带任何默认凭据 → **配错就起不来，而不是悄悄降级到 dev 口径**。
#      本地/CI 用 `mvn spring-boot:run` 由 spring-boot-maven-plugin 注入 dev profile（见 pom.xml）。
#   ② 迁移全部打进 jar（classpath:db/migration），不再依赖 `filesystem:../db/migration` 相对路径。
#      历史事故面：打 jar 部署时该相对路径不存在，而 fail-on-missing-locations=false 会**静默跳过**，
#      核心 schema（V1-V7 / V917-V926）根本不会建。
#   ③ 数据源默认值只在 application-dev.yml；本文件不出现任何可用于生产的凭据。
server:
  port: ${SERVER_PORT:9091}     # 本机 8080/8090 常被其它 java 服务占用，默认用空闲端口
  servlet:
    context-path: /v1           # 对齐契约 servers 的 /v1 basePath

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}   # fail-closed：忘设环境变量 → 走 prod 护栏，而非 dev 弱口径
  application:
    name: huicui
  jackson:
    default-property-inclusion: non_null   # 省略 null 字段：契约多数字段非 nullable，可选字段缺省即合规（统一出口）
  web:
    resources:
      add-mappings: false                  # 无静态资源，404 走 /error → JsonErrorController（JSON 而非 HTML）
  mvc:
    throw-exception-if-no-handler-found: true
  datasource:
    # 无默认值：prod 必须注入 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD（Spring 宽松绑定）。
    # dev 的默认值见 application-dev.yml。
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration      # dev 额外叠加 classpath:db/seed（见 application-dev.yml）
    # 三道保险默认取「严」。dev 因历史库存在乱序应用而单独放宽（见 application-dev.yml）。
    fail-on-missing-locations: true
    validate-on-migrate: true
    out-of-order: false

logging:
  level:
    org.flywaydb: info

# 横切层
huicui:
  jwt:
    secret: "${HUICUI_JWT_SECRET:}"    # 空默认；prod 必须注入，否则 ProdGuard 拒绝启动
    ttl-seconds: ${HUICUI_JWT_TTL:86400}
  # 第三方存证（易保全）——未配置时 enabled=false，发起存证退回占位、不阻断
  ebaoquan:
    enabled: ${HUICUI_EBQ_ENABLED:false}
    base-url: ${HUICUI_EBQ_URL:https://bs.sandbox.ebaoquan.org}
    app-key: ${HUICUI_EBQ_APPKEY:}
    app-key-secret: ${HUICUI_EBQ_SECRET:}
  # 存证备案回填轮询（易保全备案证书/链上信息约 10min 后就绪）
  evidence:
    poll:
      fixed-delay-ms: ${HUICUI_EBQ_POLL_MS:60000}
      initial-delay-ms: 20000
  # 短信（智讯云/028lk）——未配置时 enabled=false；非 dev 且未启用时 /auth/sms-code 直接 502 拒发
  sms:
    enabled: ${HUICUI_SMS_ENABLED:false}
    # dry-run：走完整条业务链路（冷却/sms_record/pay-link 状态机），但不触网关、不产生费用。
    # 只用于预发演练。prod 开启会被 ProdGuard 大声 WARN（不硬失败，允许演练）。
    # 注意：dry-run 会把短信正文（含验证码）写进日志——这是为了让人能真的登录一次。
    dry-run: ${HUICUI_SMS_DRY_RUN:false}
    secret-name: ${HUICUI_SMS_SECRET_NAME:}
    secret-key: ${HUICUI_SMS_SECRET_KEY:}
    sms-base-url: ${HUICUI_SMS_BASE:}                       # 普通短信接口地址(向对接方索取)
    video-base-url: ${HUICUI_SMS_VIDEO_BASE:http://api.028lk.com}
    sign-name: ${HUICUI_SMS_SIGN:【有证慧催】}
    # 拼进发给业主的缴费短信 /pay/{token}。prod 启用短信时必须是真实可达域名，
    # 否则 ProdGuard 拒绝启动（否则业主收到的是 localhost 链接）。
    public-base-url: ${HUICUI_PUBLIC_BASE:http://localhost:5173}
    templates:
      verify-code: ${HUICUI_SMS_TPL_VERIFY:}               # 验证码普通短信模板id(空=用明文Content)
      pay-link: ${HUICUI_SMS_TPL_PAYLINK:}                 # 缴费链接模板id(空=用明文Content)
