# 有证慧催 后端 · 基础配置（不含任何环境凭据）
#
# 部署形态铁律（勿回退）：
#   ① 默认 profile = prod，且 prod 不带任何默认凭据 → **配错就起不来，而不是悄悄降级到 dev 口径**。
#      本地/CI 用 `mvn spring-boot:run` 由 spring-boot-maven-plugin 注入 dev profile（见 pom.xml）。
#   ② 迁移全部打进 jar（classpath:db/migration），不再依赖 `filesystem:../db/migration` 相对路径。
#      历史事故面：打 jar 部署时该相对路径不存在，而 fail-on-missing-locations=false 会**静默跳过**，
#      核心 schema（V1-V7 / V917-V926）根本不会建。
#   ③ 数据源默认值只在 application-dev.yml；本文件不出现任何可用于生产的凭据。
server:
  port: ${SERVER_PORT:9091}     # 本机 8080/8090 常被其它 java 服务占用，默认用空闲端口
  servlet:
    context-path: /v1           # 对齐契约 servers 的 /v1 basePath

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}   # fail-closed：忘设环境变量 → 走 prod 护栏，而非 dev 弱口径
  application:
    name: huicui
  jackson:
    default-property-inclusion: non_null   # 省略 null 字段：契约多数字段非 nullable，可选字段缺省即合规（统一出口）
  web:
    resources:
      add-mappings: false                  # 无静态资源，404 走 /error → JsonErrorController（JSON 而非 HTML）
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      # 录音上传的**真实**限额就在这里。此前这一节根本不存在 → 落回 Spring 默认 1MB，
      # 而一段 8k 采样的真实通话录音，一分钟就 ~1MB 起——上线当天录音必然 500，
      # 核心闭环（录音→转写→复盘）第一步就断。代码层的软限额（录音 200MB / 附件 20MB）
      # 校验的是**已经收进来**的字节数，拦不住在容器层就被拒掉的请求。
      max-file-size: ${HUICUI_MAX_FILE_SIZE:200MB}      # 与 RecordingsM4Controller 的录音上限一致
      max-request-size: ${HUICUI_MAX_REQUEST_SIZE:220MB} # 略大于单文件：多一份 multipart 头与表单字段的余量
  datasource:
    # 无默认值：prod 必须注入 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD（Spring 宽松绑定）。
    # dev 的默认值见 application-dev.yml。
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration      # dev 额外叠加 classpath:db/seed（见 application-dev.yml）
    # 三道保险默认取「严」。dev 因历史库存在乱序应用而单独放宽（见 application-dev.yml）。
    fail-on-missing-locations: true
    validate-on-migrate: true
    out-of-order: false

logging:
  level:
    org.flywaydb: info

# 横切层
huicui:
  # 多实例放行开关。默认 false = 检测到同库上已有活实例就**拒绝启动**。
  # 登录票据/短信验证码/发码冷却仍在进程内存里（见 SingleInstanceGuard 的说明）——
  # 多实例下它们会静默半坏，而不是报错。真要扩容，先把这三样搬到 Redis 再放行。
  allow-multi-instance: ${HUICUI_ALLOW_MULTI_INSTANCE:false}

  # 对象存储（录音/附件）。默认 pg = 维持原样存 bytea，**不配置就行为零变化**。
  #   录音是 8k 通话音频，一个批次几千通电话就能把库撑到几十 GB，拖累备份体积、恢复时长、连接池。
  #   切到 s3：新录音进桶、库里只留 key；**存量录音仍在 bytea，读路径会回落**（双读，切换当天不会读丢）。
  #   AWS S3 / 阿里云 OSS / MinIO 走同一套 API，只有 endpoint 与 path-style 不同。
  storage:
    type: ${HUICUI_STORAGE_TYPE:pg}          # pg | s3
    s3:
      endpoint: ${HUICUI_S3_ENDPOINT:}       # OSS: https://oss-cn-chengdu.aliyuncs.com；MinIO: http://minio:9000
      region: ${HUICUI_S3_REGION:cn-north-1}
      access-key: ${HUICUI_S3_ACCESS_KEY:}
      secret-key: ${HUICUI_S3_SECRET_KEY:}
      bucket: ${HUICUI_S3_BUCKET:}
      path-style: ${HUICUI_S3_PATH_STYLE:true}   # 阿里云 OSS 要 false（virtual-host 风格），MinIO 要 true

  # 数据留存与去标识化（个保法：保存期限为实现目的所必需的最短时间）。见 RetentionService。
  #   PII（姓名/手机/身份证/住址/房号）→ 结案后 60 天去标识化
  #   通话录音 + 转写               → 结案后 180 天删除（举证窗口，不是 60 天：
  #                                   业主投诉「暴力催收」时录音是平台自证清白的唯一证据）
  #   回款/佣金/支付申请单           → 不动（会计凭证）
  # 关掉它（enabled=false）意味着个人信息**永久留存**，仅供本地开发排查用。
  retention:
    enabled: ${HUICUI_RETENTION_ENABLED:true}
    pii-days: ${HUICUI_RETENTION_PII_DAYS:60}
    recording-days: ${HUICUI_RETENTION_RECORDING_DAYS:180}
    cron: ${HUICUI_RETENTION_CRON:0 30 3 * * *}   # 03:30，错开 03:00 的备份
  # 话术飞轮定时结算（BR-M5-12 环6/环7）。见 FlywheelScheduler。
  #   把真实通话结果（承诺兑现/回款）回流进话术库统计，并把达标的 AI 变体自动晋升为现行话术。
  #   纯聚合、幂等；专家录入的话术永不自动晋升。话术库页面的「飞轮结算」按钮同时保留。
  #   关掉它（auto=false）意味着不手点就不结算 —— 统计会一直停在上次快照上。
  flywheel:
    auto: ${HUICUI_FLYWHEEL_AUTO:true}
    cron: ${HUICUI_FLYWHEEL_CRON:0 0 4 * * *}   # 04:00，错开 03:00 备份与 03:30 留存清理
  # 主密钥：三方通道密钥(易保全/短信)AES-256-GCM 落库时用它加密（V936）。
  # 未配置 → 后台存不了密钥（写侧 409），但读/回落 yml 的老路径照常工作——不影响环境变量部署的实例。
  crypto:
    master-key: "${HUICUI_CRYPTO_KEY:}"
  jwt:
    secret: "${HUICUI_JWT_SECRET:}"    # 空默认；prod 必须注入，否则 ProdGuard 拒绝启动
    ttl-seconds: ${HUICUI_JWT_TTL:86400}
  # 第三方存证（易保全）——未配置时 enabled=false，发起存证退回占位、不阻断
  ebaoquan:
    enabled: ${HUICUI_EBQ_ENABLED:false}
    base-url: ${HUICUI_EBQ_URL:https://bs.sandbox.ebaoquan.org}
    app-key: ${HUICUI_EBQ_APPKEY:}
    app-key-secret: ${HUICUI_EBQ_SECRET:}
  # 存证备案回填轮询（易保全备案证书/链上信息约 10min 后就绪）
  evidence:
    poll:
      fixed-delay-ms: ${HUICUI_EBQ_POLL_MS:60000}
      initial-delay-ms: 20000
  # 短信（智讯云/028lk）——未配置时 enabled=false；非 dev 且未启用时 /auth/sms-code 直接 502 拒发
  sms:
    enabled: ${HUICUI_SMS_ENABLED:false}
    # dry-run：走完整条业务链路（冷却/sms_record/pay-link 状态机），但不触网关、不产生费用。
    # 只用于预发演练。prod 开启会被 ProdGuard 大声 WARN（不硬失败，允许演练）。
    # 注意：dry-run 会把短信正文（含验证码）写进日志——这是为了让人能真的登录一次。
    dry-run: ${HUICUI_SMS_DRY_RUN:false}
    secret-name: ${HUICUI_SMS_SECRET_NAME:}
    secret-key: ${HUICUI_SMS_SECRET_KEY:}
    sms-base-url: ${HUICUI_SMS_BASE:}                       # 普通短信接口地址(向对接方索取)
    video-base-url: ${HUICUI_SMS_VIDEO_BASE:http://api.028lk.com}
    sign-name: ${HUICUI_SMS_SIGN:【有证慧催】}
    # 拼进发给业主的缴费短信 /pay/{token}。prod 启用短信时必须是真实可达域名，
    # 否则 ProdGuard 拒绝启动（否则业主收到的是 localhost 链接）。
    public-base-url: ${HUICUI_PUBLIC_BASE:http://localhost:5173}
    templates:
      verify-code: ${HUICUI_SMS_TPL_VERIFY:}               # 验证码普通短信模板id(空=用明文Content)
      pay-link: ${HUICUI_SMS_TPL_PAYLINK:}                 # 缴费链接模板id(空=用明文Content)
