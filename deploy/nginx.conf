# 有证慧催 · 反向代理 + TLS 终止
#
# 它同时解决三件事，缺一不可：
#   1. **TLS**。这是催收系统：过网线的是业主真实姓名/电话/住址/欠费金额，以及通话录音字节。
#      此前 9091 直接绑 0.0.0.0 明文暴露公网 —— 这一条就足以否决上线。
#   2. **同源**。业主缴费页 /pay/{token}（前端路由）与后端 /v1 必须同源：
#      HUICUI_PUBLIC_BASE 这一个变量既拼进发给业主的短信链接，又拼进给百炼回拉音频的
#      /v1/pub/recordings/{token} 签名地址。两者不同源，二者必有一个是坏的。
#   3. **前端有地方跑**。此前 compose 里根本没有 web 容器。

# HTTP：只做两件事 —— 放行 ACME 续证，其余一律跳 HTTPS。
server {
    listen 80;
    server_name ${HUICUI_DOMAIN};

    # certbot webroot 续证用，必须在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${HUICUI_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${HUICUI_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${HUICUI_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS：拿到证书之后就别再回明文了
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 录音上传是 multipart 大文件：这里放 220MB，与后端 spring.servlet.multipart 对齐。
    # nginx 默认 client_max_body_size 是 1MB —— 后端就算放开了，请求也会先死在这一层。
    client_max_body_size 220M;

    # 转写/上传是慢请求，别用默认 60s 掐断
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;   # 大文件边收边转，不先落盘攒满

    # 后端 API
    location /v1/ {
        proxy_pass http://backend:9091/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（只放 health，不暴露其它 actuator 端点）
    location = /actuator/health {
        proxy_pass http://backend:9091/actuator/health;
    }

    # 前端 SPA：静态资源 + history 模式回退
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
