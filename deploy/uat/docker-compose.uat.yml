name: huicui-uat

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UAT_POSTGRES_DB:?UAT_POSTGRES_DB is required}
      POSTGRES_USER: ${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}
    volumes:
      - huicui-uat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256M
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - uat

  backend:
    image: huicui-uat-backend:${UAT_IMAGE_TAG:?UAT_IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${UAT_POSTGRES_DB:?UAT_POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${UAT_POSTGRES_USER:?UAT_POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${UAT_POSTGRES_PASSWORD:?UAT_POSTGRES_PASSWORD is required}
      HUICUI_JWT_SECRET: ${UAT_JWT_SECRET:?UAT_JWT_SECRET is required}
      HUICUI_CRYPTO_KEY: ${UAT_CRYPTO_KEY:?UAT_CRYPTO_KEY is required}
      HUICUI_DEV_PASSWORD: ${UAT_DEV_PASSWORD:?UAT_DEV_PASSWORD is required}
      HUICUI_PUBLIC_BASE: ${UAT_PUBLIC_BASE:-http://127.0.0.1:6090}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JAVA_OPTS: -XX:MaxRAMPercentage=55 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:9092:9091"
    mem_limit: 600M
    deploy:
      resources:
        limits:
          memory: 600M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - uat

  web:
    image: huicui-uat-web:${UAT_IMAGE_TAG:?UAT_IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${UAT_WEB_BIND:-127.0.0.1}:6090:80"
    mem_limit: 128M
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - uat

  smoke:
    image: huicui-uat-smoke:${UAT_IMAGE_TAG:?UAT_IMAGE_TAG is required}
    profiles: [smoke]
    depends_on:
      web:
        condition: service_healthy
    environment:
      UAT_DEV_PASSWORD: ${UAT_DEV_PASSWORD:?UAT_DEV_PASSWORD is required}
      PLAYWRIGHT_BASE_URL: http://web
      PLAYWRIGHT_ARTIFACT_DIR: /artifacts
    volumes:
      - type: bind
        source: ${UAT_ARTIFACT_DIR:?UAT_ARTIFACT_DIR is required}
        target: /artifacts
    mem_limit: 512M
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - uat

networks:
  uat:
    name: huicui-uat-network

volumes:
  huicui-uat-pgdata:
    name: huicui-uat-pgdata
