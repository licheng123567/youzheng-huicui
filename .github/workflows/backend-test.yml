name: backend-test

# 此前**没有任何 CI 作业跑过后端单测** —— api-contract.yml 与 e2e.yml 都用 `mvn -DskipTests compile`
# 只为把服务拉起来。于是 src/test 下的用例（含短信网关「不泄露上游文案」的回归断言）
# 永远不会在 PR 上被执行，改坏了也没人知道。这个作业补上这条防线。
#
# 只跑 surefire（*Test.java），不跑 failsafe（*IT.java —— 那些要 Testcontainers）。
# 已实测：停掉本地 Postgres 后 `mvn test` 仍 23/23 通过，故本作业不需要任何数据库服务。

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn test（surefire）
        run: mvn -B test

      # 「0 个用例也算 BUILD SUCCESS」是这类 gate 的经典失效方式：
      # 测试类被误改名/误排除时构建照样绿。这里对实际执行数做下界断言。
      - name: 断言用例真的跑了（防止 0 个用例的假绿）
        run: |
          cat > /tmp/count_tests.py <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          n = fail = 0
          for f in glob.glob('target/surefire-reports/*.xml'):
              r = ET.parse(f).getroot()
              n += int(r.get('tests', 0))
              fail += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f"{n} {fail}")
          PY
          out=$(python3 /tmp/count_tests.py)
          total=${out% *}
          failed=${out#* }
          echo "surefire 执行用例数=$total 失败=$failed"
          if [ "$total" -lt 20 ]; then
            echo "::error::后端单测只跑了 $total 个（期望 ≥20）。是不是测试类被排除或改名了？"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::有 $failed 个用例失败"
            exit 1
          fi

      # 契约的 format:date-time 字段必须是 RFC3339。`String.valueOf(rs.getObject(col))` 会输出
      # `2026-07-09 07:17:59.579476`（空格分隔、无时区）——浏览器的 new Date() 宽容地接受了它，
      # 所以这个 bug 藏了很久；Android 客户端按 ISO_OFFSET_DATE_TIME 解析，整个响应直接反序列化失败。
      # 用 common/Timestamps 代替。
      - name: 禁止把 SQL 时间戳当字符串直接吐出
        run: |
          hits=$(grep -rn 'String.valueOf(rs.getObject(' src/main/java --include='*.java' \
                   | grep -v '/common/Timestamps.java' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::请改用 com.youzheng.huicui.common.Timestamps.iso(rs, \"col\")，否则客户端按 RFC3339 解析会失败"
            exit 1
          fi
          echo "OK：无 String.valueOf(rs.getObject(...)) 写法"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/app/target/surefire-reports/**
          if-no-files-found: warn

  # ── 资金并发 IT（*IT.java，failsafe）──────────────────────────────────────────
  #
  # 此前**没有任何 CI 作业跑过集成测试**：本文件的注释白纸黑字写着「只跑 surefire，不跑 failsafe」，
  # 于是全仓唯一的并发测试（HoldCapConcurrencyIT）从来没有在任何地方执行过一次。
  # 而资金正确性的每一条——唯一索引裁决、FOR UPDATE 串行化、CHECK 约束——**只在并发下才成立或失效**，
  # 单测里根本表达不出来。核心资金链路当时的测试覆盖是 0。
  #
  # 这个作业补上那条防线：真 PG + 真线程，回款/佣金的并发不变量必须每次 PR 都被验一遍。
  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/app
    services:
      postgres:
        image: pgvector/pgvector:pg16        # V1 的 script_lib.embedding vector(1024) 需要 pgvector
        env: { POSTGRES_DB: huicui, POSTGRES_USER: huicui, POSTGRES_PASSWORD: Str0ngProdPw }
        ports: ["5472:5432"]
        options: >-
          --health-cmd "pg_isready -U huicui" --health-interval 5s
          --health-timeout 5s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify（failsafe·资金并发 IT）
        env:
          HUICUI_IT_JDBC_URL: jdbc:postgresql://localhost:5472/huicui
          HUICUI_IT_JDBC_USER: huicui
          HUICUI_IT_JDBC_PASSWORD: Str0ngProdPw
        run: mvn -B verify -Dsurefire.skip=true

      # 同样的失效方式要防：IT 被跳过（比如忘了给 JDBC_URL）时 failsafe 会安静地报 0 个用例，构建照样绿。
      - name: 断言资金并发 IT 真的跑了（防"跳过即绿"）
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          n = fail = skip = 0
          for f in glob.glob('target/failsafe-reports/*.xml'):
              r = ET.parse(f).getroot()
              n += int(r.get('tests', 0)); fail += int(r.get('failures', 0)) + int(r.get('errors', 0))
              skip += int(r.get('skipped', 0))
          print(f'failsafe: tests={n} failures={fail} skipped={skip}')
          if n - skip < 4:
              print('::error::资金并发 IT 实际执行数不足 4（被跳过了？HUICUI_IT_JDBC_URL 没生效？）')
              sys.exit(1)
          if fail:
              sys.exit(1)
          PY
