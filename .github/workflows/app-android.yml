name: app-android

# 契约（docs/api/**）一变也要跑：api-client 是从契约生成的，
# 契约破坏性变更必须在这里编译失败，而不是等到真机上崩。
on:
  push:
    branches: [main]
    paths:
      - 'app-android/**'
      - 'docs/api/**'
      - 'openapitools.json'
      - '.github/workflows/app-android.yml'
  pull_request:
    paths:
      - 'app-android/**'
      - 'docs/api/**'
      - 'openapitools.json'
      - '.github/workflows/app-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 确认 runner 自带 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME" || { echo "::error::runner 无 Android SDK，需加 android-actions/setup-android"; exit 1; }

      # 契约 → Kotlin 客户端 → 编译通过。这一步是 App 侧的「契约防漂移」闸门。
      - name: :api-client:assemble（从契约 SSOT 生成并编译）
        run: ./gradlew :api-client:assemble --no-daemon --stacktrace

      - name: :app:testDebugUnitTest（登录三态 / 429 / 502）
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: :app:lintDebug
        run: ./gradlew :app:lintDebug --no-daemon

      - name: :app:assembleDebug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # release 走 R8：Tink 的 Missing class 只在这一步才暴露，debug 永远发现不了
      - name: :app:assembleRelease（R8 + lintVitalRelease）
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: huicui-app-debug
          path: app-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 上传测试与 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: |
            app-android/app/build/reports/tests/**
            app-android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
