          items: { $ref: '#/components/schemas/FeeLineItem' }
        baseCents: { $ref: '#/components/schemas/Money' }
        commCents: { $ref: '#/components/schemas/Money', description: '应结佣金=Σ明细(回款×固化比率)' }
        status: { $ref: '#/components/schemas/PaymentRequestStatusEnum' }
        voucher: { description: 'PAID 时必有(BR-M9-12d)。服务端在 complete 端点强制 required voucher 兜底', oneOf: [ { $ref: '#/components/schemas/Voucher' }, { type: 'null' } ] }
