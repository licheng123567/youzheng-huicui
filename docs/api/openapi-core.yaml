      description: 'B-04方案A：不再接受 newPassword 明文，改为清除口令+发放一次性 setupToken（哈希存 credential_setup_token，TTL 24h）。响应体返回 setupToken 明文，管理员带外告知成员走 /auth/setup-password 设密。'
