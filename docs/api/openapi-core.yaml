  /orgs/{id}/sms-config:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getOrgSmsConfig
      tags: [settings]
      summary: 组织短信配置+模板列表(v1.21.0)
      description: '物业只能读自己的(读他人→404)。配置缺行时返回平台默认值并置 configured=false。'
      x-data-scope: range
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OrgSmsConfig' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOrgSmsConfig
      tags: [settings]
      summary: 平台配置某物业的短信签名/冷却/有效期/预警/通道开关(v1.21.0·物业不可编辑)
      x-permission: settings.manage
      x-data-scope: platform
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgSmsConfigInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/OrgSmsConfig' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orgs/{id}/sms-templates:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      operationId: createOrgSmsTemplate
      tags: [settings]
      summary: 平台为某物业新建短信模板草稿(v1.21.0·待报备)
      description: 'status 恒为 DRAFT（不接受入参）；varOrder 须 ⊆ 变量白名单(payUrl/ownerName/amount/projectName/room/dueDate)，否则 422。报备后经 register 端点回填运营商模板ID 才生效。'
      x-permission: settings.manage
      x-data-scope: platform
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SmsTemplateInput' } } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/SmsTemplate' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sms-templates/{tplId}:
    parameters: [ { name: tplId, in: path, required: true, schema: { type: string } } ]
    put:
      operationId: updateOrgSmsTemplate
      tags: [settings]
      summary: 平台改短信模板草稿(v1.21.0)
      description: '仅 DRAFT/REJECTED 可改；改 ACTIVE 的内容→422(须新建草稿重新报备)。'
      x-permission: settings.manage
      x-data-scope: platform
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SmsTemplateInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SmsTemplate' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteOrgSmsTemplate
      tags: [settings]
      summary: 平台删短信模板(v1.21.0·ACTIVE 不可删)
      x-permission: settings.manage
      x-data-scope: platform
      responses:
        '204': { description: deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sms-templates/{tplId}/register:
    parameters: [ { name: tplId, in: path, required: true, schema: { type: string } } ]
    post:
      operationId: registerOrgSmsTemplate
      tags: [settings]
      summary: 回填运营商报备结果(v1.21.0)——ACTIVE(带模板ID)/REJECTED(带原因)
      description: |
        报备是**线下动作**（平台向智讯云提交签名+正文，运营商审核后给模板ID）；本端点只做状态流转与回填。
        result=ACTIVE 必须带 gatewayTemplateId（缺→422）且 varOrder 数须等于正文 {n} 占位符个数（防变量错位）；
        同 org×kind 的旧 ACTIVE 模板同事务归档（ARCHIVED），保证「一个物业每种用途只有一个生效模板」。
      x-permission: settings.manage
      x-data-scope: platform
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SmsTemplateRegisterInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/SmsTemplate' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sms-records/stats:
