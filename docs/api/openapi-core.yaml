info:
  title: 有证慧催 · API 契约（全模块·已冻结）
  version: 1.23.0  # v1.23.0(三方通道后台配置 V936): 用户诉求「易保全/LLM/ASR 的 key 后台没有配置界面」——+GET /integrations·PUT /integrations/{provider}(易保全+短信;密钥 AES-256-GCM 加密落库,主密钥 HUICUI_CRYPTO_KEY;读接口只回 last4 掩码,明文永不出接口;审计只记改了哪些 key 不记值);解析优先级 DB→yml(环境变量)→默认,故环境变量部署的实例升级后行为不变;两个客户端(EbaoquanClient/ZhixunyunSmsClient)由构造器 @Value 改为调用时解析,后台改 key 即刻生效不必重启。**LLM/ASR 不做输入框**:客户端未实现(Phase 3),填了没人读=空壳页,前端显式标注「待接入」 | v1.22.0(停权口径落地 V935): **个人停权=组织自己停,平台强制兜底**——qc.review 的 DEACTIVATE 不再当场 UPDATE account(平台越过组织停别人家的人,与 BR-M5-07 打架),改为下决定→建处置任务→归属方负责人在自己的成员管理执行并回执;+POST /dispose-tasks/{id}/enforce(逾期 72h 未回执才强停,reason 必填,写审计+通知);DisposeTask +enforceable/enforcedAt/enforceReason | **组织级停权=停新单不断存量**——+POST /orgs/{id}/disable·/enable(org.status 一直在被派单校验却没有端点能拨它,只能手工改库;现接上):停用后不能被派新单/不能新建项目·导入批次(409),但成员照常登录、在催案件照常作业、结算照常(要清场走批次结项) | v1.21.1(additive·成员管理口径对齐): listMembers +orgId 过滤——平台「成员管理」只见平台员工(SA/SE)，与「平台只建平台员工 BR-M1-04a」的写口径一致；服务商/物业成员归各自负责人管理。端点不收窄(CoordinatorPicker 需 role=PC 跨组织全量) | v1.21.0(additive·短信通道按组织管理 V934): 平台为每个物业统一配置签名/模板(物业只读)、平台代向运营商报备——+GET /sms/orgs(组织列表:签名/模板数/本月发送/短信余额) | +GET·PUT /orgs/{id}/sms-config | +POST /orgs/{id}/sms-templates·PUT·DELETE /sms-templates/{tplId}·POST /sms-templates/{tplId}/register(报备结果回填,ACTIVE 必带模板ID+变量数校验防错位,旧 ACTIVE 同事务归档) | +GET /sms-records/stats(全量口径KPI,取代前端100条computed) | /sms-records +orgId 参数&响应 +orgId/orgName | 底层:org_sms_config+org_sms_template(V934),SmsService 四级兜底解析(org→settings→yml→常量,不缓存);**修真bug**:settings.sms 此前是只写不读黑洞(SA填的签名后端从不读)、UI写cooldownMinutes而后端读cooldownSeconds(改了永不生效) | v1.20.0(收敛·法律文书停止计费 V933): 系统无「法律文书余额」概念——去 createCaseLegalDoc 的 LEGAL 扣费挂点;额度总览只出 STT/SMS/EVIDENCE 三类;存量 LEGAL 计费数据 V933 清除;BillingTypeEnum 的 LEGAL 值保留仅为兼容(删枚举=破坏性变更)、无写入路径。法律文书业务功能(legal_doc/生成/送达/legal.create)不受影响 | v1.19.0(additive·额度管理 V932): 计费明细+充值中心合并为「额度管理」——+GET /billing/orgs(组织额度总览:一行=组织×类型,余额+本月/上月用量+rechargeable 矩阵下发) | +GET /billing/usage/summary(按 组织×类型×月/日 聚合) | /billing/usage +orgId 参数&响应 +orgId/orgName | /billing/recharge-log +orgId 参数&响应 +orgId/orgName/note/operatedByName,ref 改可空(修既有违约:DB 恒写 NULL) | /orgs +type/status 过滤(充值选择器须排除 DISABLED) | 底层:org_balance 权威余额表(V932,取代 recharge_log 快照推导;EVIDENCE/LEGAL 后付允许负余额=欠用记账) + 真实扣费路径补齐(单条录音解析/短信发送/存证出证/法务文书;此前只有 STT 批量补解析) | v1.18.0(收敛·开放抢单停用 V931): setBatchOpenRate/openCaseForClaim 标 deprecated·停用桩恒 409(个体跨商抢单让个人行为产生组织义务·与组织对组织商业模型断裂;服务商执行不佳走 批次结项→重派;催收员抢单仅限本商公海 S2) | 释放/TC 到期一律回 S2(去 S4 回流) | sea pool=open 恒空集 | 结算 OUT 生效率去 open_rate 兜底只认 payOutRate | PoolDist 去 s4 | 存量 S4 案件 V931 迁回平台公海 | v1.17.0(additive·批次结项+承接段 V930): +POST /batches/{id}/close-engagement(结项=终止当前服务商承接·S1/S2/S3 全部收回回平台公海·承诺保留·批次回 PENDING 可重派;审计写 case.engagement-recall 不触发再派护栏——结项后重派对象含派回原商由平台裁量) | +GET /batches/{id}/close-preview(结项确认框:可收回统计+带有效分期承诺案件警示) | +GET /batches/{id}/engagements(承接历史:每段 服务商/起止/付佣快照/期间回款[按 V914 到账快照+时间窗归段·结算口径一致不漂移]/期间回款率=期间回款÷期初剩余应收/结项原因) | BatchBase +运营统计可选字段(projectName/providerName/caseCount/dueTotalCents/repaidTotalCents/repayRate/engagementCount/poolDist——角色中立进 Base 三视图同含,修批次列表幽灵列) | getOperationReport dimension +provider(案件侧按当前 c.provider_id/回款侧按快照 provider_id_at_repay) | v1.16.0(additive·平台双线总账 V929): +GET /recon/rollup-dual(平台批次维一行双线 应收/已收/未收+应付/已付/未付+毛利;platform-only) | RepayLine +双线可空字段(commInCents/settledIn/paymentRequestIdIn/prNoIn 平台+物业;commOutCents/settledOut/paymentRequestIdOut/prNoOut 平台+服务商;providerIdAtRepay/providerName 仅平台;legacy settled/paymentRequestId 废弃为按视角映射——PROVIDER=OUT 线值,其余=IN 线值);底层 repay_line 占用拆双线(同一笔回款可同时进 IN 收佣单与 OUT 付佣单,各线独立结清) | v1.15.0(additive·质检处置修正): RiskRecord +violatorOrgName/violatorRole/ownScope(谁的员工谁处置判定·平台看反馈对象);平台去 qc.escalate(顶层不上报只复核处置);dispose/escalate 补通知反馈组织负责人/当事人(BR-M5-07a/b/c) | v1.14.0(additive·确定性飞轮闭环): +POST /script-lib/recompute(飞轮结算重算+达标 AI 变体自动晋升环7) | Promise +scriptId(承诺话术归因·环3) | getScriptFlywheel +scriptId(单条话术漏斗·口径修正为单调子集) | PromiseInput.sourceSuggestionId 语义落地(采纳话术卡→承诺归因) | v1.13.0(additive·SA 飞轮+作战手册): +GET /script-lib/flywheel(话术飞轮漏斗+Wilson趋势) | +GET /projects/{id}/playbook/diff(作战手册版本对比行级diff) | v1.12.0(additive·平台超管页还原): Script +wilson(话术库排序权威透出) | listCases +holderName/contactPhone(案件管理归属催收员/联系方式列) | getOperationReport dimension +collector(经营报表催收员维,已于 v1.10.0 引入合并至此) | v1.11.0(additive·计费明细穿透列): BillingUsage +ownerName/room/projectName/batchNo(caseId join,计费明细页明细行业主/房号/项目/批次列;修服务商计费明细空表——STT 用量归服务商 org 见 seed) | v1.10.0(additive·佣金名册明细): CoCommissionBatchRow +caseCount/baseCents(案件数·回款金额,支撑佣金明细待结算/已结算分档) | v1.9.0(语义收敛·统一支付逻辑): 付佣线(OUT)生成/发送/撤回改为仅平台(服务商对支付申请单只读,批次结算标记照常可见;OUT 归属由明细 provider_id_at_repay 快照推导且须一致);佣金线(服务商→催收员 co-pay-docs)不变 | v1.8.0(additive·VL 团队即时看板 US-M10-03): CollectorCapacity +todayActions/todayRepayCents(工作台看板与指派弹窗共用同端点) | v1.7.0(additive·公海可见性收敛 BR-M3-29): listSea/listSeaEvents 补 x-permission=sea.view(全契约最后两个无权限点业务读端点;PL/PC 无此点→403·公海概念消失);平台方对 pool=provider 改返回空集(不看服务商公海明细,明细归 VL/CO;平台靠 T1/T2 预警与聚合) | v1.6.0(additive·App 多角色): listCases +holderId(私海过滤;催收员端「我持有的」——不传时 range scope 对 CO 返回本服务商全部案件,并非本人持有) | v1.5.0(additive·契约外端点回写): +录音回听 audio(V921)/佣金三端点 comm-status·comm-in-rate·commission-rates(V922)/附件四端点 attachments·upload-sessions(V923)/存证证书 certificate;rebindOrgOwner 200 补 ownerSetupToken;escalate 补 note;sms-code 补 502(未启用拒发·废 000000 后门) | v1.4.0(additive·remediation/contract-98): +单案再派/批量指派/释放记录/佣金批次下钻/存证重试·证据包/短信导出/减免·手册一键同步端点;CaseDetail.markCodes;BatchView reduceDrift/playbookDrift;CoPayDoc documentUrl/sealed;listCases +projectId/q;BIZ_REDISPATCH_GUARD | v1.3.1(additive): TodoCategoryEnum +T2_RETURN_WARN/T1_DISPATCH_WARN(定时器预警 BR-M3-13a) | v1.3.0: +个人中心·搜索 | v1.2.0: +消息中心·sea/events | v1.1.0: +workbench·派单决策
  contact: { name: 契约 Owner（架构师）, email: api-owner@youzheng.example }
  description: |
    从高保真原型 + PRD(BR/US) + 报告14口径抽取的全模块契约（单一事实源 SSOT）。**v1.0 已冻结（2026-06-24）**：经 codex×2 + 人工×2 共四轮独立审计、openapi-generator Spring 桩 mvn compile、Flyway 真库迁移三重验证，0 阻断/0 高。破坏性变更须升 major + 双 approve。
    覆盖：主数据(项目/批次/案件) → 派单/公海 → 催收作业(录音/AI复盘/跟进/减免) → 结案 → 结算(支付申请单·手动组单/撤销重生成/凭证) → 质检复核 → 业主H5。
    外围(存证M6/充值M9-B/报表M10/AI M5/组织成员M1)已纳入。

    **约定**：金额一律 amount_cents(分, integer)；比率 rate(**分数 0-1**, number, 如 0.08=8%；v1.0.3 统一,展示层 ×100)；时间 ISO8601；
    状态/类型一律枚举码(见 components.schemas 各 *Enum)。所有列表默认分页+按当前主体数据范围(scope)强制过滤。

    **扩展字段**：
    - `x-permission`: 调用该端点所需权限点(对齐 permMatrix / 02-角色操作权限矩阵)。
    - `x-data-scope`: own-org(本组织) | range(SE 数据范围:区域/物业/服务商三维 BR-M1-14) | platform(仅平台) | case-holder(仅本案持有催收员 BR-M4-01) | case-actor(案件持有催收员 OR 案件关联物业负责人/协调员(PL/PC) OR 平台代操作(SA) BR-M4-01a/M1-15；注:仅持有催收员本人动作重置 T_collector) | public(无登录) —— 服务端强制裁剪，非仅前端隐藏。
    - `x-settlement-side-rule` / `x-response-by-role`: 支付申请单线别绑定、按角色返回不同响应 schema(资金双线字段级隔离)。
