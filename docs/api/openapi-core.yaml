      responses:
        '200': { description: 'ok。resetPassword=true 时带 ownerSetupToken(一次性设密令牌明文，仅此响应出现一次，带外转交新负责人 B-04方案A)；否则空对象', content: { application/json: { schema: { type: object, properties: { ownerSetupToken: { type: string, description: '一次性 setupToken(TTL 24h)；仅 resetPassword=true 返回' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orgs/{id}/disable:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [org-member]
      operationId: disableOrg
      summary: 停用组织(停新单不断存量 BR-M1-15)·写审计+通知负责人
      description: |
        组织级停权(v1.22.0)。停用后：**不能被派新单**(派单早已校验 org.status='ACTIVE'——这个开关一直在承重，
        却没有任何端点能合法地拨它，只能手工改库；本端点把它接上)、**不能新建项目/导入批次**(409)；
        **但成员照常登录、在催案件照常作业、结算照常**——一按就把在催案件变死账，伤的是物业的回款。
        要清场另走「批次结项」(POST /batches/{id}/close-engagement)，那才是收回案件的动作。
        平台自身不可停用(409)。reason 必填。
      x-permission: org.manage
      x-data-scope: platform
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, description: '停用原因(必填·写审计与站内信)' } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, status: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orgs/{id}/enable:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [org-member]
      operationId: enableOrg
      summary: 恢复启用组织(BR-M1-15)·写审计+通知负责人
      x-permission: org.manage
