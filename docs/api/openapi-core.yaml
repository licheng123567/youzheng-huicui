    BillingUsage: { type: object, description: '能力用量·只量不金额(US-M10-02)。ownerName/room/projectName/batchNo 由 caseId join 补齐(计费明细页穿透列;v1.11.0);计费明细恒为成功计费(失败不计费 BR-M6-06,故无 status)', properties: { id: { type: string }, type: { $ref: '#/components/schemas/BillingTypeEnum' }, qty: { type: number }, unit: { type: string, description: '分钟/条/次/件' }, caseId: { type: [string, 'null'] }, ownerName: { type: [string, 'null'], description: '案件业主(caseId join·脱敏案件为占位)' }, room: { type: [string, 'null'] }, projectName: { type: [string, 'null'] }, batchNo: { type: [string, 'null'] }, occurredAt: { type: string, format: date-time }, orgId: { type: [string, 'null'], description: 'v1.19.0 组织维度(平台按组织聚合/下钻必需；报表 capabilityUsage 聚合行为 null)' }, orgName: { type: [string, 'null'] } } }
    BillingUsagePage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BillingUsage' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    RechargeLog: { type: object, description: '充值/扣减流水。balance=操作后余额快照(对账可读)；权威余额源为 org_balance(V932)', properties: { id: { type: string }, type: { $ref: '#/components/schemas/BillingTypeEnum' }, delta: { type: number, description: '+充值/-扣减' }, balance: { type: number }, ref: { type: string, description: '关联单据号(充值 RC-*/扣减 rec#|sms#|ev#|legal#)；存量空值经 COALESCE 落空串——schema 保持非空以免破坏兼容' }, tm: { type: string, format: date-time }, orgId: { type: [string, 'null'], description: 'v1.19.0' }, orgName: { type: [string, 'null'] }, note: { type: [string, 'null'] }, operatedByName: { type: [string, 'null'], description: '操作人姓名' } } }
    RechargeLogPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RechargeLog' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    RechargeInput:
      type: object
      required: [orgId, type, qty]
      description: |
        平台后台充值能力额度（BR-M9-06a）。
        充值类型仅限预付项（RechargeTypeEnum）：STT 分钟(物业/服务商均可预充)、SMS 条数(仅物业)。
        EVIDENCE/LEGAL 按次计入对账非预充（不在此枚举，BR-M9-10）。
        org×type 矩阵：服务商仅可充 STT；物业可充 STT 或 SMS；EVIDENCE/LEGAL 物业按次计入对账、非预充。
      properties:
        orgId: { type: string }
        type: { $ref: '#/components/schemas/RechargeTypeEnum' }
        qty: { type: number }
        note: { type: string }

