        repayRate: { $ref: '#/components/schemas/Rate' }
        caseCount: { type: integer }

    # ---------- AI 配置/话术库/作战手册 M5 ----------
    IntegrationProviderEnum: { type: string, enum: [EBAOQUAN, SMS], description: '三方通道：EBAOQUAN=易保全存证 / SMS=智讯云短信' }
    Integration:
      type: object
      description: '三方通道配置。密钥只以 last4 掩码出现，明文永不出接口'
      properties:
        provider: { $ref: '#/components/schemas/IntegrationProviderEnum' }
        name: { type: string, description: '展示名(易保全/智讯云)' }
        enabled: { type: boolean }
        configured: { type: boolean, description: '密钥与必填地址是否都有值(含 yml 回落)。false 时点启用会 422' }
        source: { type: string, enum: [DB, ENV, NONE], description: '实际生效的配置来源：DB=后台维护 / ENV=环境变量 / NONE=未配置' }
        settings: { type: object, additionalProperties: { type: string }, description: '非密字段明文(baseUrl/smsBaseUrl/videoBaseUrl)；未配置的键不出现' }
        secretsMasked: { type: object, additionalProperties: { type: string }, description: '密钥掩码(****abc)；未配置的键不出现' }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedByName: { type: [string, 'null'] }
        cryptoReady: { type: boolean, description: '主密钥 HUICUI_CRYPTO_KEY 是否就绪；false 时后台存不了密钥(写侧 409)' }
    IntegrationInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: { type: string }, description: '非密字段；缺键=不改，空串=清除(回落 yml)' }
        secrets: { type: object, additionalProperties: { type: string }, description: '密钥明文；**缺键=不改**(掩码绝不写回)，空串=清除，非空=加密覆盖' }
    AiConfig:
      type: object
      description: 平台AI配置(密钥密文·SE需授权 BR-M5-13)
      properties:
        llm: { type: object, properties: { provider: { type: string, example: deepseek }, model: { type: string }, temperature: { type: number }, maxTokens: { type: integer } } }
        asr: { type: object, properties: { provider: { type: string, example: bailian }, model: { type: string, example: paraformer-8k-v2 }, hotwords: { type: array, items: { type: string } } } }
        prompts: { type: object, properties: { preCall: { type: string }, postReview: { type: string }, riskRules: { type: string } } }
        flywheel: { type: object, properties: { autoIterate: { type: boolean }, trigger: { type: string }, adoptMode: { $ref: '#/components/schemas/PlaybookAdoptModeEnum' }, liveHint: { type: boolean, description: '通话中实时提示·恒false(OQ-M5-1)' } } }
    Script:
      type: object
      properties: { id: { type: string }, scene: { type: string }, intent: { type: string }, cohort: { type: string }, source: { $ref: '#/components/schemas/ScriptSourceEnum' }, uses: { type: integer }, promiseRate: { $ref: '#/components/schemas/Rate' }, repayRate: { $ref: '#/components/schemas/Rate' }, wilson: { type: ['number', 'null'], description: 'Wilson 置信下界(排序权威·话术库 BR-M5;v1.11.0 透出)' }, status: { $ref: '#/components/schemas/ScriptStatusEnum' }, variant: { type: [object, 'null'], properties: { text: { type: string }, uplift: { $ref: '#/components/schemas/Rate' }, state: { type: string } } } }
    ScriptInput: { type: object, required: [scene, text], properties: { scene: { type: string }, intent: { type: string }, cohort: { type: string }, text: { type: string } } }
    FlywheelRecompute:
      type: object
      description: '飞轮结算结果:recomputed=回流重算的话术数,promoted=达标自动晋升的变体数'
      properties:
        recomputed: { type: integer }
        promoted: { type: integer }
    ScriptFlywheel:
      type: object
      description: '话术飞轮:funnel 转化漏斗(通话接通→命中承诺信号→登记承诺→承诺兑现回款);wilsonTrend 月度 Wilson 下界趋势'
      properties:
        funnel: { type: array, items: { type: object, properties: { stage: { type: string }, n: { type: integer }, pct: { type: integer, description: '占首段(通话接通)百分比' } } } }
        wilsonTrend: { type: array, items: { type: object, properties: { m: { type: string, description: '月份标签' }, w: { type: number, description: 'Wilson 下界 0-1' } } } }
        note: { type: string }
    ScriptPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Script' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    PlaybookDiff:
      type: object
      description: '作战手册两版行级对比。items[].kind: add(新增)/del(删除)/keep(未变)'
      properties:
        fromVersion: { type: [string, 'null'] }
        toVersion: { type: string }
        items: { type: array, items: { type: object, properties: { kind: { type: string, enum: [add, del, keep] }, text: { type: string } } } }
    Playbook:
      type: object
      properties: { projectId: { type: string }, version: { type: string }, content: { type: string }, adoptMode: { $ref: '#/components/schemas/PlaybookAdoptModeEnum' }, adoptedBy: { type: [string, 'null'] }, versions: { type: array, items: { type: object, properties: { version: { type: string }, source: { type: string }, by: { type: string }, tm: { type: string } } } } }

    # ---------- 组织/成员/审计 M1 ----------
    OrgInput: { type: object, required: [type, name, ownerAccount, ownerPhone], properties: { type: { $ref: '#/components/schemas/OrgTypeEnum' }, name: { type: string }, ownerAccount: { type: string }, ownerPhone: { type: string } } }
    Org:
      type: object
      description: '组织（B-04方案A：POST /orgs 201 响应及 PATCH /orgs/{id}/owner?resetPassword=true 响应含 ownerSetupToken 一次性明文；列表/GET 始终 null）'
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/OrgTypeEnum' }
        name: { type: string }
        ownerAccountId: { type: string }
        status: { type: string }
        ownerSetupToken: { type: [string, 'null'], description: '一次性凭据交付 token 明文（仅 POST /orgs 201 及 PATCH owner?resetPassword=true 响应出现一次，带外转交 owner；审计不记明文）' }
    OrgPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Org' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    MemberInput: { type: object, required: [username, name, phone, role], properties: { username: { type: string }, name: { type: string }, phone: { type: string }, role: { $ref: '#/components/schemas/RoleTemplateEnum' }, permissions: { type: array, items: { type: string }, description: '负责人权限子集' } } }
    Member: { type: object, properties: { id: { type: string }, orgId: { type: string }, username: { type: string }, name: { type: string }, phone: { type: string }, role: { $ref: '#/components/schemas/RoleTemplateEnum' }, status: { type: string }, isOwner: { type: boolean }, manageable: { type: boolean, description: '当前主体是否可管(平台对跨组织成员=false BR-M1-04a)' } } }
    MemberPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Member' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }

    # ---------- 系统业务规则配置 (settings) ----------
    SettingsDomainEnum: { type: string, enum: [TIMERS, ROTATION, MARK_CODES, CLOSE_REASONS, SMS], description: '计时器/轮转/标记码/关闭原因/短信阈值' }
    Settings:
      type: object
      description: '系统业务规则配置(平台可配·带版本/生效时间·参数变更只对新计时案件生效 BR-M3-19)'
      properties:
        domain: { $ref: '#/components/schemas/SettingsDomainEnum' }
        version: { type: integer, description: '配置版本' }
        effectiveAt: { type: string, format: date-time, description: '生效时间(对新计时案件生效)' }
        timers: { type: [object, 'null'], description: 'TIMERS 域(BR-M3-19)', properties: { t1Hours: { type: integer, description: 'T1 平台公海滞留' }, tCollectorHours: { type: integer, description: '催收员无跟进释放 CFG-TC' }, t2Hours: { type: integer, description: '服务商处置时限' }, maxCycleDays: { type: integer, description: '最长周期' } } }
        rotation: { type: [object, 'null'], description: 'ROTATION 域', properties: { maxRotations: { type: integer, description: '最大轮转次数' }, holdCap: { type: integer, description: '催收员持有上限 CFG-HOLDCAP BR-M3-06' } } }
        markCodes: { type: [array, 'null'], description: 'MARK_CODES 域 CFG-MARK-CODES BR-M4-12。connected=true 表示接通；effectiveFollowUp=true 表示有效跟进，服务端据此决定是否重置 T_collector(BR-M4-03/12)。ERD注：前四常见码=接通有效，末尾未接通码=false。', items: { type: object, properties: { code: { type: string }, label: { type: string }, enabled: { type: boolean }, connected: { type: boolean, description: '是否接通(true=接通)' }, effectiveFollowUp: { type: boolean, description: '是否有效跟进；true 时服务端重置 T_collector(BR-M4-03)' } } } }
        closeReasons: { type: [array, 'null'], description: 'CLOSE_REASONS 域 CFG-CLOSE-REASONS', items: { type: object, properties: { kind: { $ref: '#/components/schemas/CloseKindEnum' }, code: { type: string }, label: { type: string } } } }
        sms: { type: [object, 'null'], description: 'SMS 域 CFG-SMS-COOLDOWN BR-M4-14a', properties: { cooldownMinutes: { type: integer, description: '同案短信冷却分钟' } } }
    SettingsInput:
      type: object
      required: [domain]
      description: '更新配置(带生效时间·写审计·只对新计时案件生效 BR-M3-19)'
      properties:
        domain: { $ref: '#/components/schemas/SettingsDomainEnum' }
        effectiveAt: { type: [string, 'null'], format: date-time, description: '空=立即生效' }
        timers: { type: [object, 'null'], properties: { t1Hours: { type: integer }, tCollectorHours: { type: integer }, t2Hours: { type: integer }, maxCycleDays: { type: integer } } }
        rotation: { type: [object, 'null'], properties: { maxRotations: { type: integer }, holdCap: { type: integer } } }
        markCodes: { type: [array, 'null'], description: 'MARK_CODES 域；connected/effectiveFollowUp 须与 Settings.markCodes 保持一致结构(BR-M4-12)', items: { type: object, properties: { code: { type: string }, label: { type: string }, enabled: { type: boolean }, connected: { type: boolean, description: '是否接通' }, effectiveFollowUp: { type: boolean, description: '是否有效跟进；true 时服务端重置 T_collector' } } } }
        closeReasons: { type: [array, 'null'], items: { type: object, properties: { kind: { $ref: '#/components/schemas/CloseKindEnum' }, code: { type: string }, label: { type: string } } } }
        sms: { type: [object, 'null'], description: 'SMS 域 CFG-SMS-COOLDOWN BR-M4-14a/M9-08/09。签名/模板由平台统一配置(BR-M9-09)，物业不创建', properties: { cooldownMinutes: { type: integer, description: '同案短信冷却分钟' }, signature: { type: [string, 'null'], description: '短信签名(平台统一配置 CFG-SMS-SIGN BR-M9-09)' }, templates: { type: [array, 'null'], description: '可用短信模板列表(平台统一配置 CFG-SMS-TPL BR-M9-09)', items: { type: object, properties: { id: { type: string }, name: { type: string }, content: { type: string } } } }, warnThreshold: { type: [integer, 'null'], description: '短信条数预警阈值 CFG-SMS-WARN(BR-M9-08)' } } }
    CoordinatorsInput:
      type: object
      required: [coordinatorIds]
      description: '维护项目/批次关联协调员(全量覆盖·变更写审计 BR-M2-13/US-M2-02)'
      properties:
        coordinatorIds: { type: array, items: { type: string } }
    AuditLog:
      type: object
      description: 审计日志(授权变更/启停/登录/交接/代操作全程留痕 BR-M1-08/15)
      properties:
        id: { type: string }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        scope: { type: [string, 'null'], description: '操作时的数据范围' }
        proxyFor: { type: [string, 'null'], description: '代操作=代谁(平台代物业/服务商 BR-M1-15)' }
        before: { type: [object, 'null'], description: '变更前快照' }
        after: { type: [object, 'null'], description: '变更后快照' }
        reason: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
        tm: { type: string, format: date-time }
    AuditLogPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    PermissionMatrixItem:
      type: object
      description: 权限矩阵条目(功能点×角色×权限码×数据范围 BR-M1-04c)
      properties:
        feature: { type: string, description: '功能/模块' }
        role: { $ref: '#/components/schemas/RoleTemplateEnum' }
        permission: { type: string, description: '权限码(对齐 permMatrix)' }
        dataScope: { type: string, description: 'own-org|range|platform|case-holder|public' }
        allowed: { type: boolean }
    CoordinatorRef: { type: object, properties: { id: { type: string }, name: { type: string } }, description: '协调员引用(PC↔项目/批次 多对多 BR-M2-13)' }
    MemberPatch:
      type: object
      description: 成员权限/数据范围调整(US-M1-04)。停用/启用/重置密码走专用动作端点
      properties:
        name: { type: string }
        permissions: { type: array, items: { type: string }, description: '权限子集调整' }
        dataScope: { type: object, properties: { areas: { type: array, items: { type: string } }, properties: { type: array, items: { type: string } }, providers: { type: array, items: { type: string } } } }
    OwnerRebindInput: { type: object, required: [newPhone], description: '负责人改绑手机+重置密码交接(US-M1-09)', properties: { newPhone: { type: string }, resetPassword: { type: boolean } } }
    SupervisionAction:
      type: object
      description: '成员督导记录(BR-M10-10)·写审计'
      properties:
        id: { type: string }
        memberId: { type: string, description: '被督导成员 id' }
        memberName: { type: string }
        action: { $ref: '#/components/schemas/SupervisionActionEnum' }
        note: { type: [string, 'null'], description: '督导备注' }
        operatorId: { type: string, description: '操作人(组织负责人)' }
        operatorName: { type: string }
        createdAt: { type: string, format: date-time }
    SupervisionActionPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SupervisionAction' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    SmsTemplateKindEnum: { type: string, enum: [PAY_LINK, NOTIFY, VIDEO_NOTIFY], description: '模板用途。VERIFY_CODE 不入组织模板——验证码是平台级短信(发送时无组织上下文)，恒用平台全局模板' }
    SmsTemplateStatusEnum: { type: string, enum: [DRAFT, ACTIVE, REJECTED, ARCHIVED], description: 'DRAFT=待报备 / ACTIVE=已生效(有运营商模板ID) / REJECTED=运营商驳回 / ARCHIVED=被新版替换' }
    SmsTemplate:
      type: object
      description: '组织短信模板(v1.21.0)。平台代向运营商报备：DRAFT→register→ACTIVE(回填模板ID)；同 org×kind 只一个 ACTIVE'
      properties:
        id: { type: string }
        orgId: { type: string }
        kind: { $ref: '#/components/schemas/SmsTemplateKindEnum' }
        name: { type: string }
        content: { type: string, description: '报备正文，占位 {0} {1}（与 varOrder 下标同构）' }
        varOrder: { type: array, items: { type: string }, description: '变量顺序(防报备错位)：payUrl/ownerName/amount/projectName/room/dueDate' }
        gatewayTemplateId: { type: [string, 'null'], description: '运营商报备号；ACTIVE 时非空' }
        status: { $ref: '#/components/schemas/SmsTemplateStatusEnum' }
        rejectReason: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    SmsTemplateInput:
      type: object
      required: [kind, name, content]
      properties:
        kind: { $ref: '#/components/schemas/SmsTemplateKindEnum' }
        name: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        varOrder: { type: array, items: { type: string }, description: '须 ⊆ 变量白名单，否则 422' }
    SmsTemplateRegisterInput:
      type: object
      required: [result]
      description: '回填运营商报备结果。ACTIVE 必带 gatewayTemplateId；REJECTED 建议带 reason'
      properties:
        result: { type: string, enum: [ACTIVE, REJECTED] }
        gatewayTemplateId: { type: string }
        reason: { type: string }
    OrgSmsConfig:
      type: object
      description: '组织短信配置(v1.21.0)。平台统一配置、物业只读；configured=false 表示该物业在吃平台默认值'
      properties:
        orgId: { type: string }
        orgName: { type: string }
        configured: { type: boolean }
        signName: { type: string }
        cooldownMinutes: { type: integer, description: '同案短信冷却(分钟)。后端存秒，此处按分钟出入——修既有 UI 写分钟/后端读秒的键名 bug' }
        payLinkTtlDays: { type: integer, description: '缴费链接有效期(天)' }
        warnThreshold: { type: [integer, 'null'], description: '短信余额条数预警(空=不预警)' }
        enabled: { type: boolean, description: '组织短信通道开关(平台 kill-switch)' }
        templates: { type: array, items: { $ref: '#/components/schemas/SmsTemplate' } }
    OrgSmsConfigInput:
      type: object
      properties:
        signName: { type: string, minLength: 1 }
        cooldownMinutes: { type: integer, minimum: 0 }
        payLinkTtlDays: { type: integer, minimum: 1 }
        warnThreshold: { type: [integer, 'null'], minimum: 0 }
        enabled: { type: boolean }
    SmsOrgRow:
      type: object
      description: '短信通道组织行(v1.21.0)：一行=一个物业组织'
      properties:
        orgId: { type: string }
        orgName: { type: string }
        orgType: { $ref: '#/components/schemas/OrgTypeEnum' }
        signName: { type: [string, 'null'], description: '未配置→null(吃平台默认)' }
        configured: { type: boolean }
        enabled: { type: boolean }
        activeTemplates: { type: integer }
        draftTemplates: { type: integer }
        sentThisMonth: { type: integer }
        failedThisMonth: { type: integer }
        smsBalance: { type: [number, 'null'], description: '短信额度余额(条)——与额度管理同源 org_balance' }
    SmsOrgPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SmsOrgRow' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    SmsStats:
      type: object
      description: '短信发送统计(v1.21.0·全量口径，取代前端 100 条 computed)'
      properties:
        total: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        delivered: { type: integer }
        failReasons: { type: array, items: { type: object, properties: { reason: { type: string }, count: { type: integer } } } }
    SmsSendRecord:
      type: object
      description: '短信发送明细(BR-M4-16/M9-08)；失败不退条数，见 failureReason'
      properties:
        id: { type: string }
        caseId: { type: [string, 'null'], description: '关联案件 id' }
        projectId: { type: [string, 'null'], description: '关联项目 id' }
        template: { type: [string, 'null'], description: '使用的短信模板名称/id' }
        status: { $ref: '#/components/schemas/SmsSendStatusEnum' }
        failureReason: { type: [string, 'null'], description: 'FAILED 时的失败原因' }
        sentAt: { type: string, format: date-time, description: '发送时间' }
        orgId: { type: [string, 'null'], description: 'v1.21.0 归属组织(NULL=验证码等平台级短信)' }
        orgName: { type: [string, 'null'], description: 'v1.21.0' }
    SmsSendRecordPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SmsSendRecord' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
