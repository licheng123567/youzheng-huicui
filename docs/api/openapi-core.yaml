paths:

  /auth/setup-password:
    post:
      operationId: setupPassword
      tags: [auth]
      summary: 消费一次性 setupToken 设置初始密码(B-04方案A·新 owner/重置成员凭据交付闭环)
      description: |
        消费 credential_setup_token 发放的一次性明文 token（SHA-256 哈希匹配+TTL 24h+一次性）：
        设 account.password_hash + must_change_password=FALSE。token 只能使用一次，过期或已用返 401。
        此端点无需登录（public），由新 owner/成员在收到带外 token 后自行调用。
      security: []
      x-permission: none
      x-data-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: '一次性 setupToken 明文（由平台带外转交，24h 有效）' }
                newPassword: { type: string, minLength: 6, description: '新密码（至少 6 位）' }
      responses:
        '200': { description: 密码设置成功，账号可正常登录 }
        '401': { $ref: '#/components/responses/Unauthorized', description: 'token 无效、已过期或已使用' }
        '403': { $ref: '#/components/responses/Forbidden', description: '账号已停用' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/sms-code:
    post:
      operationId: requestSmsCode
      tags: [auth]
      summary: 请求短信验证码(手机号登录第一步 BR-M1-10)
      security: []
      x-permission: none
      x-data-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: '手机号' }
      responses:
        '200': { description: 验证码已发送 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: 请求过于频繁(限流·同手机号 60s 内只发一次)，稍后重试 }
        '502': { $ref: '#/components/responses/BadGateway', description: '短信通道未启用/网关不可达(BIZ_SMS_FAILED)。非 dev 环境短信未启用时一律拒发——不存在固定验证码' }

  /auth/select-account:
    post:
      operationId: selectAccount
      tags: [auth]
      summary: 多账号选择换取 token(BR-M1-11 一号多账号)
      security: []
      x-permission: none
      x-data-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginTicket, accountId]
              properties:
                loginTicket: { type: string, description: '多账号登录临时票据(LoginResult.loginTicket)' }
                accountId: { type: string, description: '选择的账号 id' }
      responses:
        '200':
          description: 换取 token 成功
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginTokenResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 统一登录(账号密码 / 手机验证码)——按账号自动识别角色组织，无入口分类
      security: []
      x-permission: none
      x-data-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/LoginByPassword' }
                - { $ref: '#/components/schemas/LoginBySms' }
              discriminator:
                propertyName: mode
                mapping:
                  password: '#/components/schemas/LoginByPassword'
                  sms: '#/components/schemas/LoginBySms'
      responses:
        '200':
          description: 登录成功(单账号返回 token；一号多账号时返回 loginTicket+accounts 供选择 BR-M1-11)
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: 当前主体(角色/组织/数据范围/权限点集)
      x-data-scope: own-org
      responses:
        '200':
          description: ok
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMe
      tags: [auth]
      summary: 自助设置密码 / 变更手机号(所有角色 BR-M1-09)
      x-permission: self
      x-data-scope: own-org
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/SelfAccountUpdate' } } }
      responses:
        '204': { description: ok }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: 项目列表(按 scope 过滤)
      x-data-scope: range
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createProject
      tags: [projects]
      summary: 新建项目(含收佣比例必填 BR-M9-01a)
      x-permission: proj.edit
      x-data-scope: own-org
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectInput' } } }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      operationId: getProject
      tags: [projects]
      summary: 项目档案。服务端按角色返回不同 schema：物业/平台=Project(含 commInRate)，服务商=ProjectForProvider(字段级无佣金 BR-M1-06/M9-11)
      x-data-scope: range
      x-response-by-role: 'property|platform → Project; provider → ProjectForProvider'
      responses:
        '200':
          description: ok(按角色返回 Project 或 ProjectForProvider)
