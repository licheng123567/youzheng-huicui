    CoCommissionPersonPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CoCommissionPerson' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }
    DisposeTaskPage: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DisposeTask' } }, meta: { $ref: '#/components/schemas/PageMeta' } } }

    # ---------- 外围模块 v1.0 枚举 ----------
    EvidenceSceneEnum: { type: string, enum: [DELIVERY, RECORDING, MATERIAL_PACK], description: '送达/录音/材料打包(同价按次)' }
    EvidenceStatusEnum: { type: string, enum: [ISSUING, ISSUED, FAILED], description: '出证中/已出证/失败' }
    BillingTypeEnum: { type: string, enum: [STT, SMS, EVIDENCE, LEGAL], description: 'STT分钟(预付)/短信条(预付)/存证次(后付·按次计入对账)。**LEGAL 已停用 v1.20.0**——法律文书生成不计费、不进额度体系；枚举值保留仅为兼容(删除=破坏性变更)，无写入路径、不出现在额度总览' }
