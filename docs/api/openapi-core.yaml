        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /integrations:
    get:
      tags: [settings]
      operationId: listIntegrations
      summary: 三方通道配置列表(易保全/短信·密钥只回掩码 v1.23.0)
      description: |
        用户诉求：「易保全、LLM、ASR 这些三方接口的 key，后台没有配置界面。」
        **只做真接得通的两个通道**：易保全(存证) + 智讯云(短信)——客户端真实存在，填了就真能用。
        LLM/ASR 的客户端还没写(Phase 3)，此刻做输入框只会造出「配了但不生效」的空壳页，故不入列表；
        前端在 AI 区域显式标注「待接入」。
        **密钥永不出接口**：secretsMasked 只回 last4(****abc)。source 指明这台机器实际吃的是哪份配置
        (DB=后台维护 / ENV=环境变量 / NONE=未配置)——解析优先级 DB → yml → 默认，
        故已用环境变量部署的实例升级后行为不变。
      x-permission: settings.manage
      x-data-scope: platform
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Integration' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations/{provider}:
    parameters: [ { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/IntegrationProviderEnum' } } ]
    put:
      tags: [settings]
      operationId: updateIntegration
      summary: 维护三方通道(密钥 AES-GCM 加密落库·改完即刻生效)·写审计
      description: |
        secrets 语义：**缺键=不改**(前端回显的是掩码，不能把掩码当明文写回去)；传空串=清除该密钥(回落 yml)；传非空=加密覆盖。
        409：主密钥 HUICUI_CRYPTO_KEY 未配置——宁可存不进去，也不要把 key 明文躺在库里。
        422：enabled=true 但密钥/接口地址没填齐(点了启用却发不出去，运维会以为开了其实没开)；
             或启用易保全但地址仍指向 sandbox(沙箱出的证书没有法律效力)。
        审计只记「哪些 key 被改过」，绝不记值。
      x-permission: settings.manage
      x-data-scope: platform
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IntegrationInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Integration' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: 业务规则配置查询(计时器/轮转/标记码/关闭原因/短信阈值 BR-M3-19/M4-12/14a)
      description: '不分页。返回配置字典裸数组(每域一条，域数固定有限)。按 domain 过滤。'
      x-data-scope: platform
      parameters: [ { name: domain, in: query, schema: { $ref: '#/components/schemas/SettingsDomainEnum' } } ]
      responses: { '200': { description: ok, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Settings' } } } } } }
    put:
      tags: [settings]
      operationId: updateSettings
      summary: 维护业务规则配置(带版本/生效时间·参数变更只对新计时案件生效 BR-M3-19)·写审计
      x-permission: settings.manage
      x-data-scope: platform
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsInput' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---- 短信通道按组织管理 v1.21.0（平台统一配置签名/模板，物业只读；平台代向运营商报备模板）----
  /sms/orgs:
    get:
      operationId: listSmsOrgs
      tags: [settings]
      summary: 短信通道组织列表(v1.21.0)——每个物业的签名/模板数/本月发送量/短信余额
      description: '平台=全部物业组织；物业=仅本组织(服务商无短信业务→空集)。configured=false 表示该物业在吃平台默认配置。'
